server {
  listen ${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Browser calls /api/* on the same origin.
  # API_GATEWAY_URL is https://<render-host> on Render, or http://api-gateway:3000 in Compose.
  location /api/ {
    proxy_pass ${API_GATEWAY_URL};
    proxy_http_version 1.1;
    proxy_read_timeout 600s;

    proxy_set_header Host ${API_GATEWAY_HOST};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_ssl_server_name on;
    proxy_ssl_name ${API_GATEWAY_HOST};

    proxy_pass_header Set-Cookie;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

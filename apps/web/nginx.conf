server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Browser calls /api/* on the same origin.
  # Nginx forwards these requests to the API Gateway deployed on Render.
  location /api/ {
    proxy_pass https://kits-api-gateway-demo.onrender.com;
    proxy_http_version 1.1;

    proxy_set_header Host kits-api-gateway-demo.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_ssl_server_name on;
    proxy_ssl_name kits-api-gateway-demo.onrender.com;

    proxy_pass_header Set-Cookie;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# This file defines the future local microservices development topology.
services:
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
    command: ["pnpm", "--filter", "@korean-learning/api-gateway", "dev"]
    environment:
      PORT: "3000"
      USER_SERVICE_URL: http://user-service:8000
      CONTENT_SERVICE_URL: http://content-service:3001
      LEARNING_SERVICE_URL: http://learning-service:3002
      ANALYTICS_SERVICE_URL: http://analytics-service:3003
      AI_SERVICE_URL: http://ai-service:3000
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - content-service
      - ai-service
      - analytics-service
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    environment:
      USER_DATABASE_URL: postgresql+psycopg://postgres:postgres@user-postgres:5432/user_service
      JWT_SECRET: ${USER_JWT_SECRET:-local-development-secret-change-in-production}
      JWT_ISSUER: kits-user-service
      JWT_AUDIENCE: kits-services
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAILS: ${USER_ADMIN_EMAILS:-admin@example.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Local default: Mailpit (http://localhost:8025). Override with Gmail in .env when ready.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-kits@local.test}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SECURE_COOKIES: "false"
    ports:
      - "8001:8000"
    depends_on:
      user-postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  user-service-frontend:
    build:
      context: .
      dockerfile: apps/user-service/frontend/Dockerfile
      args:
        VITE_API_URL: ${USER_API_URL:-http://localhost:8001/api/v1}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:80"
    depends_on:
      - user-service
    restart: unless-stopped

  content-service:
    build:
      context: .
      dockerfile: apps/content-service/Dockerfile
    environment:
      PORT: "3001"
      CONTENT_DATABASE_URL: postgresql://postgres:postgres@content-postgres:5432/content_service
    ports:
      - "3001:3001"
    depends_on:
      content-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  learning-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
    command: ["pnpm", "--filter", "@korean-learning/learning-service", "dev"]

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@ai-postgres:5432/ai_service
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.6-27b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      MAX_CONTEXT_MESSAGES: ${MAX_CONTEXT_MESSAGES:-12}
      MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-6000}
      FRONTEND_ORIGIN: ${AI_FRONTEND_ORIGIN:-http://localhost:5173,http://localhost:5174,http://localhost:8081,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8081}
    ports:
      - "3004:3000"
    depends_on:
      ai-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-service-frontend:
    build:
      context: ./apps/ai-service/frontend
      dockerfile: Dockerfile
      args:
        # Empty = same origin; nginx proxies /conversations and /health to ai-service.
        VITE_API_URL: ${AI_API_URL:-}
    ports:
      - "8081:80"
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: apps/analytics-service/Dockerfile
    environment:
      PORT: "3003"
      ANALYTICS_DATA_FILE: /data/analytics.json
      ANALYTICS_DATABASE_URL: postgresql://postgres:postgres@analytics-postgres:5432/analytics_service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3003:3003"
    volumes:
      - analytics-data:/data
    depends_on:
      analytics-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  user-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  content-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: content_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - content-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d content_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  learning-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: learning_service
      POSTGRES_PASSWORD: postgres
    volumes:
      - learning-postgres-data:/var/lib/postgresql/data

  ai-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ai_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  analytics-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: analytics_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - analytics-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  user-postgres-data:
  content-postgres-data:
  learning-postgres-data:
  ai-postgres-data:
  analytics-postgres-data:
  analytics-data:
